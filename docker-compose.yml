# Shared infra: Postgres (Chinook), llm-meter proxy, DB-GPT.
# WrenAI runs from its own upstream compose in ./wrenai and joins the same network.
name: nl2sql-bench

networks:
  nl2sql-net:
    name: nl2sql-net

volumes:
  pgdata:
  dbgpt-data:
  ollama-data:

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_chinook.sql:/docker-entrypoint-initdb.d/01_chinook.sql:ro
      - ./db/99_bench_user.sql:/docker-entrypoint-initdb.d/99_bench_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d chinook -tAc 'select 1 from track limit 1' | grep -q 1"]
      interval: 5s
      retries: 30
    networks:
      nl2sql-net:
        aliases: [bench-postgres]
    mem_limit: 512m

  llm-meter:
    build: ./meter
    image: nl2sql-bench/llm-meter:1.0
    environment:
      LLM_UPSTREAM_BASE: ${LLM_UPSTREAM_BASE:-https://api.openai.com/v1}
      EMBEDDING_UPSTREAM_BASE: ${EMBEDDING_UPSTREAM_BASE:-http://ollama:11434/v1}
      # local Ollama ignores auth; don't forward the cloud key to it
      STRIP_AUTH_FOR_EMBEDDINGS: "${STRIP_AUTH_FOR_EMBEDDINGS:-1}"
    ports:
      - "${METER_PORT:-8089}:8080"
    networks: [nl2sql-net]
    mem_limit: 256m

  # local embeddings (Ollama Cloud has no embeddings endpoint)
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.6}
    volumes:
      - ollama-data:/root/.ollama
    networks: [nl2sql-net]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  dbgpt:
    build: ./dbgpt
    image: nl2sql-bench/dbgpt:v0.8.2-pg
    command: dbgpt start webserver --config /app/configs/dbgpt-bench.toml
    environment:
      OPENAI_API_KEY: ${LLM_API_KEY:-}   # DB-GPT proxy/openai reads this name
      LLM_MODEL_NAME: ${LLM_MODEL:-gpt-oss:120b}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL:-nomic-embed-text}
      OPENAI_API_BASE: http://llm-meter:8080/dbgpt/v1
      EMBEDDING_MODEL_API_URL: http://llm-meter:8080/dbgpt/v1/embeddings
    volumes:
      - ./dbgpt/dbgpt-bench.toml:/app/configs/dbgpt-bench.toml:ro
      - dbgpt-data:/app/pilot
    ports:
      - "${DBGPT_PORT:-5670}:5670"
    depends_on:
      postgres: {condition: service_healthy}
      llm-meter: {condition: service_started}
    restart: unless-stopped
    networks: [nl2sql-net]
    mem_limit: 2g

  cube:
    image: cubejs/cube:v1.8.8
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: ${BENCH_PG_HOST:-bench-postgres}
      CUBEJS_DB_PORT: ${BENCH_PG_PORT:-5432}
      CUBEJS_DB_NAME: ${BENCH_PG_DB:-chinook}
      CUBEJS_DB_USER: ${BENCH_PG_USER:-bench}
      CUBEJS_DB_PASS: ${BENCH_PG_PASSWORD:-bench}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-nl2sql-bench-local-secret}
      CUBEJS_DEV_MODE: "true"
      CUBEJS_TELEMETRY: "false"
      CUBEJS_SCHEMA_PATH: model
    volumes:
      - ./cube/model:/cube/conf/model:ro
    ports:
      - "${CUBE_PORT:-4000}:4000"
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    networks: [nl2sql-net]
    mem_limit: 1g
  cube_v2:
    # cube_v2: same Cube Core release, richer model (./cube_v2/model) + SQL API (Postgres wire protocol) enabled.
    image: cubejs/cube:v1.8.8
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: ${BENCH_PG_HOST:-bench-postgres}
      CUBEJS_DB_PORT: ${BENCH_PG_PORT:-5432}
      CUBEJS_DB_NAME: ${BENCH_PG_DB:-chinook}
      CUBEJS_DB_USER: ${BENCH_PG_USER:-bench}
      CUBEJS_DB_PASS: ${BENCH_PG_PASSWORD:-bench}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-nl2sql-bench-local-secret}
      CUBEJS_DEV_MODE: "true"
      CUBEJS_TELEMETRY: "false"
      CUBEJS_SCHEMA_PATH: model
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_SQL_USER: ${CUBE_SQL_USER:-cube}
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD:-cube-local}
      CUBESQL_SQL_PUSH_DOWN: "true"
      CUBEJS_TESSERACT_SQL_PLANNER: "true"
    volumes:
      - ./cube_v2/model:/cube/conf/model:ro
    ports:
      - "${CUBE_V2_PORT:-4001}:4000"
      - "${CUBE_V2_SQL_PORT:-15432}:15432"
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    networks: [nl2sql-net]
    mem_limit: 1500m
