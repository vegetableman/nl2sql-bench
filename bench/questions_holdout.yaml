# Held-out Chinook questions — NOT paraphrases of bench/questions.yaml.
# Written to stress cube_v2 / Wren semantic layers that were tuned on the original 29.
# Do NOT edit cube_v2 model, router Cube prompt, or Wren MDL to fit these.
dataset: chinook-1.4.5-holdout
questions:
# --- easy ---
- id: ho01
  difficulty: easy
  question: How many distinct media types are there?
  gold_sql: SELECT COUNT(*) FROM media_type;
  notes: in-model control (media_types view)

- id: ho02
  difficulty: easy
  question: How many customers have a fax number recorded?
  gold_sql: SELECT COUNT(*) FROM customer WHERE fax IS NOT NULL;
  notes: customer.fax is not in the cube_v2 model

- id: ho03
  difficulty: easy
  question: How many tracks are larger than 15 megabytes (bytes > 15 * 1024 * 1024)?
  gold_sql: SELECT COUNT(*) FROM track WHERE bytes > 15 * 1024 * 1024;
  notes: in-model control using track.bytes (distinct from the duration question in the original set)

- id: ho04
  difficulty: easy
  question: How many invoices have a billing address that contains the word Street?
  gold_sql: SELECT COUNT(*) FROM invoice WHERE billing_address ILIKE '%Street%';
  notes: invoice.billing_address is not in the cube_v2 model

# --- medium ---
- id: ho05
  difficulty: medium
  question: What is the average track file size in bytes for each media type? Return the media type name and the average bytes.
  gold_sql: SELECT mt.name, AVG(t.bytes) AS avg_bytes FROM track t JOIN media_type mt ON mt.media_type_id = t.media_type_id GROUP BY mt.name;
  notes: in-model (bytes + media_type)

- id: ho06
  difficulty: medium
  question: How many playlists contain tracks from at least 10 different genres?
  gold_sql: |
    SELECT COUNT(*) FROM (
      SELECT pt.playlist_id
      FROM playlist_track pt
      JOIN track t ON t.track_id = pt.track_id
      GROUP BY pt.playlist_id
      HAVING COUNT(DISTINCT t.genre_id) >= 10
    ) x;
  notes: playlist × genre diversity; playlists are in cube_v2 but this grain is uncommon

- id: ho07
  difficulty: medium
  question: List employees born in the 1970s. Return first name, last name and birth date, ordered by birth date.
  gold_sql: |
    SELECT first_name, last_name, birth_date
    FROM employee
    WHERE birth_date >= '1970-01-01' AND birth_date < '1980-01-01'
    ORDER BY birth_date;
  order_matters: true
  order_cols: [2]
  notes: employee.birth_date is in cube_v2 employees view

- id: ho08
  difficulty: medium
  question: How many customers have a phone number that starts with '+55'?
  gold_sql: SELECT COUNT(*) FROM customer WHERE phone LIKE '+55%';
  notes: customer.phone is not in the cube_v2 model

- id: ho09
  difficulty: medium
  question: What percentage of total sales revenue (unit price times quantity) comes from media types whose name contains 'video'? Round to 2 decimal places.
  gold_sql: |
    SELECT ROUND(
      100.0 * SUM(CASE WHEN mt.name ILIKE '%video%' THEN il.unit_price * il.quantity ELSE 0 END)
      / SUM(il.unit_price * il.quantity), 2)
    FROM invoice_line il
    JOIN track t ON t.track_id = il.track_id
    JOIN media_type mt ON mt.media_type_id = t.media_type_id;
  notes: ratio / percentage over media type

# --- hard ---
- id: ho10
  difficulty: hard
  question: For each day of the week in 2024, how many invoices were issued? Return the day-of-week number (0 = Sunday through 6 = Saturday) and the invoice count, ordered by day-of-week number.
  gold_sql: |
    SELECT EXTRACT(DOW FROM invoice_date)::int AS dow, COUNT(*) AS invoice_count
    FROM invoice
    WHERE invoice_date >= '2024-01-01' AND invoice_date < '2025-01-01'
    GROUP BY EXTRACT(DOW FROM invoice_date)
    ORDER BY dow;
  order_matters: true
  order_cols: [0]
  notes: unusual time grain (day-of-week); cube_v2 time dims are calendar date / DATE_TRUNC oriented

- id: ho11
  difficulty: hard
  question: For each support representative, which customer has the highest total invoice spend? Include ties. Return the representative's first name, last name, the customer's first name, last name, and the spend.
  gold_sql: |
    WITH spends AS (
      SELECT e.first_name AS rep_first, e.last_name AS rep_last,
             c.first_name AS cust_first, c.last_name AS cust_last,
             SUM(i.total) AS spend,
             RANK() OVER (PARTITION BY e.employee_id ORDER BY SUM(i.total) DESC) AS rk
      FROM employee e
      JOIN customer c ON c.support_rep_id = e.employee_id
      JOIN invoice i ON i.customer_id = c.customer_id
      GROUP BY e.employee_id, e.first_name, e.last_name, c.customer_id, c.first_name, c.last_name
    )
    SELECT rep_first, rep_last, cust_first, cust_last, spend
    FROM spends
    WHERE rk = 1;
  notes: ranking within groups (per support rep)

- id: ho12
  difficulty: hard
  question: Which artists have never had any track appear on an invoice line (never sold)? Return the artist names ordered alphabetically.
  gold_sql: |
    SELECT a.name
    FROM artist a
    WHERE NOT EXISTS (
      SELECT 1
      FROM album al
      JOIN track t ON t.album_id = al.album_id
      JOIN invoice_line il ON il.track_id = t.track_id
      WHERE al.artist_id = a.artist_id
    )
    ORDER BY a.name;
  order_matters: true
  order_cols: [0]
  notes: anti-join at artist grain (original set asks the same idea for tracks, not artists)

- id: ho13
  difficulty: hard
  question: For each quarter of 2024, show the total invoice revenue and the previous quarter's revenue. Return quarter number, revenue and previous-quarter revenue, ordered by quarter.
  gold_sql: |
    WITH q AS (
      SELECT EXTRACT(QUARTER FROM invoice_date)::int AS qtr, SUM(total) AS rev
      FROM invoice
      WHERE invoice_date >= '2024-01-01' AND invoice_date < '2025-01-01'
      GROUP BY EXTRACT(QUARTER FROM invoice_date)
    )
    SELECT qtr, rev, LAG(rev) OVER (ORDER BY qtr) AS prev_rev
    FROM q
    ORDER BY qtr;
  order_matters: true
  order_cols: [0]
  notes: quarter grain + LAG (cube_v2 has prior-month / prior-year measures, not prior-quarter)

- id: ho14
  difficulty: hard
  question: Which ISO week numbers of 2023 had the highest invoice revenue? Return the top 3 week numbers and their revenue, highest revenue first.
  gold_sql: |
    SELECT EXTRACT(WEEK FROM invoice_date)::int AS week_num, SUM(total) AS revenue
    FROM invoice
    WHERE invoice_date >= '2023-01-01' AND invoice_date < '2024-01-01'
    GROUP BY EXTRACT(WEEK FROM invoice_date)
    ORDER BY revenue DESC
    LIMIT 3;
  order_matters: true
  order_cols: [1]
  notes: unusual ISO-week time grain

- id: ho15
  difficulty: hard
  question: How many distinct billing postal codes appear on invoices billed to Canada?
  gold_sql: |
    SELECT COUNT(DISTINCT billing_postal_code)
    FROM invoice
    WHERE billing_country = 'Canada' AND billing_postal_code IS NOT NULL;
  notes: invoice.billing_postal_code is not in the cube_v2 model
